services:
  coding-guru:
    build:
      context: .
      dockerfile: Dockerfile
    image: coding-guru:latest
    container_name: coding-guru-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=supersecret_jwt_coding_guru_key_2026_x7a9
      - ADMIN_INVITE_KEY=admin123
    volumes:
      - coding_guru_data:/app/db/data

volumes:
  coding_guru_data:
    driver: local
